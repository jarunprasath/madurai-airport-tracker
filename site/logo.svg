    <rect x="31" y="19.2" width="2" height="2" rx=".4"/>
    <rect x="25" y="24.2" width="2" height="2.4" rx=".4"/><rect x="31" y="24.2" width="2" height="2.4" rx=".4"/><rect x="37" y="24.2" width="2" height="2.4" rx=".4"/>
    <rect x="23" y="29.8" width="2" height="2.6" rx=".4"/><rect x="31" y="29.8" width="2" height="2.6" rx=".4"/><rect x="39" y="29.8" width="2" height="2.6" rx=".4"/>
    <rect x="21" y="35.6" width="2" height="2.8" rx=".4"/><rect x="27" y="35.6" width="2" height="2.8" rx=".4"/><rect x="35" y="35.6" width="2" height="2.8" rx=".4"/><rect x="41" y="35.6" width="2" height="2.8" rx=".4"/>
    <rect x="19" y="41.6" width="2" height="3" rx=".4"/><rect x="25.5" y="41.6" width="2" height="3" rx=".4"/><rect x="36.5" y="41.6" width="2" height="3" rx=".4"/><rect x="43" y="41.6" width="2" height="3" rx=".4"/>
