<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Gopuram of the Meenakshi Amman Temple, Madurai</title>
  <circle cx="32" cy="32" r="32" fill="#D99A2B"/>
  <g fill="#7A1E2C">
