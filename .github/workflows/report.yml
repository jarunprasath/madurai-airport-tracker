name: Generate report
# PowerPoint + Excel reports. Automatic: weekly every Monday, monthly on the 8th, yearly (financial year) on 20 June.
# On demand: Actions -> Generate report -> Run workflow (choose weekly/monthly and any date in the period).
on:
  schedule:
    - cron: "41 2 * * 1"   # Monday 08:11 IST - last week
    - cron: "41 2 8 * *"   # 8th of month - last month
    - cron: "41 3 20 6 *"  # 20 June - last financial year (AAI's March data is out by then)
  workflow_dispatch:
    inputs:
      kind:
        description: "Report type"
        type: choice
        options: [weekly, monthly, yearly, 10-year-review]
        default: weekly
      date:
        description: "Any date inside the wanted week/month/financial year, YYYY-MM-DD (blank = last complete period)"
        default: ""
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt && npm install --no-audit --no-fund
      - name: Install slide renderer (LibreOffice, poppler, metric-compatible fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress poppler-utils fonts-crosextra-carlito fonts-crosextra-caladea >/dev/null
      - name: Build report
        run: |
          KIND="${{ inputs.kind }}"
          if [ -z "$KIND" ]; then
            case "${{ github.event.schedule }}" in
              "41 2 8 * *") KIND=monthly ;;
              "41 3 20 6 *") KIND=yearly ;;
              *) KIND=weekly ;;
            esac
          fi
          if [ "$KIND" = "10-year-review" ]; then
            python -m ixm decade | tee report.log
          else
            ARGS="--kind $KIND"
            [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date ${{ inputs.date }}"
            python -m ixm report $ARGS | tee report.log
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ixm-report
          path: |
            reports/*.pptx
            reports/*.xlsx
            reports/*.pdf
      - name: Commit report
        run: |
          git config user.name "ixm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/*.pptx reports/*.xlsx reports/*.pdf
          git diff --cached --quiet || git commit -m "report: $(grep -o 'IXM_[A-Za-z0-9_-]*' report.log | head -1)"
          # retry: if another run or a code push changed the same data meanwhile, keep this run's data
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::Could not push data after 3 attempts"; exit 1
  deploy:
    needs: report
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
