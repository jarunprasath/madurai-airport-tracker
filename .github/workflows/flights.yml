name: Collect flights
# Arrivals/departures for yesterday (final) and today (schedule) from AeroDataBox.
# Once a day at 00:31 UTC = 06:01 IST: 2 days x 2 half-day requests = 4 requests/day (~120/month),
# sized for the free BASIC plan's monthly unit quota.
on:
  schedule:
    - cron: "31 0 * * *"
  workflow_dispatch:
    inputs:
      back:
        description: "Days before today to fetch (max 31 per run)"
        default: "1"
      ahead:
        description: "Days after today to fetch"
        default: "0"
      from_date:
        description: "History backfill: first date YYYY-MM-DD, at most 365 days ago (blank = normal daily run)"
        default: ""
      to_date:
        description: "History backfill: last date YYYY-MM-DD (max 31 days per run; blank = same day)"
        default: ""
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch flights
        env:
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
        run: |
          if [ -n "${{ inputs.from_date }}" ]; then
            python -u -m ixm flights --from "${{ inputs.from_date }}" ${{ inputs.to_date && format('--to {0}', inputs.to_date) || '' }} | tee flights_run.log
          else
            python -u -m ixm flights --back "${{ inputs.back || 1 }}" --ahead "${{ inputs.ahead || 0 }}" | tee flights_run.log
          fi
          { echo "### Flight collection"; echo '```'; tail -n 40 flights_run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit data (also after a partial run)
        if: always()
        run: |
          git config user.name "ixm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: flights $(date -u +%F)"
          # retry: if another run or a code push changed the same data meanwhile, keep this run's data
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::Could not push data after 3 attempts"; exit 1
  deploy:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
